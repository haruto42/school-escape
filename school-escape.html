<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクールエスケープ</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: min(100vw, 100vh);
            height: min(100vw, 100vh);
            image-rendering: pixelated;
        }

        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .stick {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.3;
            transform: translate(-50%, -50%);
        }

        #stickBase {
            width: 120px;
            height: 120px;
            background: #888888;
            border: 3px solid #000000;
        }

        #piano {
            position: fixed;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: min(92vw, 520px);
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.88);
            color: #ffffff;
            text-align: center;
        }

        #pianoInfo {
            min-height: 1.4em;
            margin-bottom: 8px;
            font-size: min(4vw, 18px);
        }

        #pianoKeys {
            display: flex;
            gap: 4px;
            justify-content: center;
        }

        .pianoKey {
            flex: 1;
            height: min(24vw, 110px);
            border: 2px solid #000000;
            border-radius: 0 0 6px 6px;
            background: #ffffff;
            color: #000000;
            font-size: min(3.6vw, 16px);
            cursor: pointer;
        }

        .pianoKey:active {
            background: #cccccc;
        }

        #pianoClose {
            margin-top: 8px;
            padding: 4px 18px;
            border: 2px solid #ffffff;
            border-radius: 6px;
            background: #000000;
            color: #ffffff;
            font-size: min(3.6vw, 16px);
            cursor: pointer;
        }

        #cheat {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 20;
            width: 220px;
            padding: 8px;
            border: 1px solid #ffffff;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.88);
            color: #ffffff;
            font-size: 13px;
        }

        #cheat select, #cheat button {
            margin: 2px 0;
            font-size: 13px;
        }

        #cheat select {
            width: 100%;
        }

        #cheatItems button {
            display: block;
            width: 100%;
            text-align: left;
        }

        #lever {
            position: fixed;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            width: min(94vw, 560px);
            padding: 10px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.88);
            color: #ffffff;
            text-align: center;
            font-size: min(3.8vw, 16px);
        }

        #leverBeam {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin: 34px 0;
            transform-origin: center;
            transition: transform 0.3s;
        }

        .leverSpot {
            width: min(9vw, 44px);
            height: min(9vw, 44px);
            line-height: min(9vw, 44px);
            border: 2px solid #888888;
            border-radius: 4px;
            background: #3a2a14;
            font-size: min(5vw, 22px);
        }

        button.leverSpot {
            border-color: #ffffff;
            background: #7a5a2a;
            color: #ffffff;
            cursor: pointer;
        }

        #leverPivot {
            width: min(9vw, 44px);
            font-size: min(7vw, 30px);
        }

        #leverClose {
            margin-top: 6px;
            padding: 4px 18px;
            border: 2px solid #ffffff;
            border-radius: 6px;
            background: #000000;
            color: #ffffff;
            font-size: min(3.6vw, 16px);
            cursor: pointer;
        }

        #items {
            position: fixed;
            top: 6px;
            left: 8px;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            font-size: min(3.5vw, 16px);
            pointer-events: none;
        }

        #message {
            position: fixed;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            max-width: 90vw;
            white-space: pre-line;
            padding: 10px 18px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            font-size: min(5vw, 22px);
            text-align: center;
            pointer-events: none;
        }

        canvas.shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%   { transform: translate(0, 0); }
            10%  { transform: translate(-10px, 5px); }
            20%  { transform: translate(9px, -6px); }
            30%  { transform: translate(-8px, -4px); }
            40%  { transform: translate(8px, 6px); }
            50%  { transform: translate(-6px, 3px); }
            60%  { transform: translate(6px, -3px); }
            70%  { transform: translate(-4px, 2px); }
            80%  { transform: translate(3px, -2px); }
            90%  { transform: translate(-2px, 1px); }
            100% { transform: translate(0, 0); }
        }

        #gameOver {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s;
        }

        #gameOver.show {
            opacity: 1;
            pointer-events: auto;
        }

        #gameOverText {
            color: #cc2222;
            font-size: min(10vw, 56px);
            letter-spacing: 0.1em;
        }

        #gameOverReason {
            max-width: 90vw;
            color: #ffffff;
            font-size: min(4.5vw, 22px);
            text-align: center;
        }

        #clearScreen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s;
        }

        #clearScreen.show {
            opacity: 1;
            pointer-events: auto;
        }

        #clearText {
            color: #f5b800;
            font-size: min(10vw, 56px);
            letter-spacing: 0.1em;
            text-shadow: 0 0 14px #ffe680;
        }

        #clearReason {
            max-width: 90vw;
            color: #b8860b;
            font-size: min(4.5vw, 22px);
            text-align: center;
        }

        #clearAgain {
            padding: 10px 36px;
            border: 3px solid #f5b800;
            background: #ffffff;
            color: #b8860b;
            font-size: min(6vw, 28px);
            cursor: pointer;
        }

        #clearAgain:disabled {
            opacity: 0.3;
            cursor: default;
        }

        #againButton {
            padding: 10px 36px;
            border: 3px solid #ffffff;
            background: #000000;
            color: #ffffff;
            font-size: min(6vw, 28px);
            cursor: pointer;
        }

        #againButton:disabled {
            opacity: 0.3;
            cursor: default;
        }

        #stickKnob {
            width: 50px;
            height: 50px;
            background: #000000;
        }
    </style>
</head>

    <div id="cheat" hidden>

        </div>
        <div id="leverStatus"></div>
        <button id="leverClose">やめる</button>
    </div>
    <div id="items" hidden></div>
    <div id="message" hidden></div>
    <div id="gameOver">
        <div id="gameOverText">GAME OVER</div>
        <div id="gameOverReason"></div>
        <button id="againButton" disabled>again</button>
    </div>
    <div id="clearScreen">
        <div id="clearText">ESCAPE CLEAR!</div>
        <div id="clearReason">先生を倒し、正門から学校を脱出した！</div>
        <button id="clearAgain" disabled>もう一度</button>

    <div id="stickBase" class="stick" hidden></div>

            tone(type,startFreq,endFreq,delay,duration,volume = this.volume) {
                if (!this.ctx) {
                    return;
                };
                const start = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(startFreq,start);
                osc.frequency.exponentialRampToValueAtTime(endFreq,start + duration);
                gain.gain.setValueAtTime(volume,start);
                gain.gain.exponentialRampToValueAtTime(0.001,start + duration);

                osc.connect(gain);

                osc.start(start);

                if (!this.ctx) {

                const syllables = [[300,2300],[800,1300],[800,1300],[800,1300],[300,2300],[350,1300],[500,1900]];
                const pitches = [210,190,200,180,210,190,230];
                const step = 0.25;
                syllables.forEach((formants,i) => {
                    const start = this.ctx.currentTime + i*step;
                    const osc = this.ctx.createOscillator();
                    const amp = this.ctx.createGain();
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(pitches[i],start);
                    amp.gain.setValueAtTime(0.001,start);
                    amp.gain.linearRampToValueAtTime(1.6,start + 0.03);

                        filter.type = "bandpass";
                        filter.frequency.value = freq;
                        filter.Q.value = 6;
                        osc.connect(filter);
                        filter.connect(amp);

                    amp.connect(this.ctx.destination);

                for (let i = 0; i < length; i++) {
                    data[i] = Math.random()*2 - 1;
                };
                const noise = this.ctx.createBufferSource();
                const gain = this.ctx.createGain();
                noise.buffer = buffer;
                gain.gain.setValueAtTime(this.volume,this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime + 0.7);
                noise.connect(gain);
                gain.connect(this.ctx.destination);

        // 図書室のカウンターの上の秘伝の書。何度でも読み返せる

        // てこのパズル。左に固定のおもり、右の5か所に手持ちのおもりを置いて、回す力(おもり×支点からの距離)を釣り合わせる
        // 左のおもりは、ゲームを始めるたび(リスタートも)に変わる。必ず解ける組み合わせだけを出す
        const leverWeights = [1,2,3,4];

        const lever = {
            leftWeight:0,

        const leverSolvable = (target) => {
            // 4つのおもりを、5か所のどこかに置く(置かない場合も含む)全ての組み合わせを調べる
            const search = (index,used,sum) => {
                if (sum > target) {
                    return false;
                };
                if (index === leverWeights.length) {
                    return sum === target;
                };
                if (search(index + 1,used,sum)) {
                    return true;
                };
                for (let slot = 1; slot <= leverSlots; slot++) {
                    if (!used.includes(slot) && search(index + 1,used.concat(slot),sum + leverWeights[index]*slot)) {
                        return true;
                    };
                };
                return false;
            };
            return search(0,[],0);
        };

                    lever.leftDistance = distance;
                    break;
                };

            lever.right = [0,0,0,0,0];

        // 追いかけてくる先生(マップをまたいで追う)。遅めの速度で、壁を避けて近づく
        const chaser = {

        // 縦横4方向のマス移動で、通れるマスをたどる最短経路(次のマスから目的地まで)
        const findPath = (sx,sy,gx,gy) => {
            const map = mapData[gameData.mapId];
            const width = map[0].length;
            const height = map.length;
            const key = (x,y) => y*width + x;
            const prev = new Map([[key(sx,sy),null]]);
            const queue = [[sx,sy]];

            for (let i = 0; i < queue.length; i++) {
                const [x,y] = queue[i];
                if (x === gx && y === gy) {
                    break;
                };
                for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx < 0 || ny < 0 || nx >= width || ny >= height || prev.has(key(nx,ny))) {
                        continue;
                    };
                    if (!(nx === gx && ny === gy) && solidTiles.has(getTile(nx,ny))) {
                        continue;
                    };
                    prev.set(key(nx,ny),[x,y]);
                    queue.push([nx,ny]);
                };
            };

            if (!prev.has(key(gx,gy))) {
                return [];
            };
            const path = [];
            let cur = [gx,gy];
            while (cur && !(cur[0] === sx && cur[1] === sy)) {
                path.unshift(cur);
                cur = prev.get(key(cur[0],cur[1]));
            };
            return path;
        };

        const updateChaser = (delta) => {
            if (!chaser.active || chaser.mapId !== gameData.mapId) {
                return;
            };
            const size = config.tileSize;

            // 別のマップから追ってきたときは、少し遅れて、プレイヤーが入ってきた場所に現れる
            if (chaser.waiting > 0) {
                chaser.waiting -= delta;
                if (chaser.waiting <= 0) {
                    chaser.waiting = 0;
                    chaser.x = chaser.spawnX;
                    chaser.y = chaser.spawnY;
                    chaser.tx = Math.floor(chaser.x/size);
                    chaser.ty = Math.floor(chaser.y/size);
                    chaser.path = [];
                };
                return;
            };

            // 滑り込んだあと、少しその場で立ち止まってから追いかけ始める
            if (chaser.slide <= 0 && chaser.pause > 0) {
                chaser.pause -= delta;
                return;
            };

            let budget = (chaser.slide > 0 ? chaser.speed*2 : chaser.speed)*delta;
            chaser.slide = Math.max(0,chaser.slide - delta);

            for (let guard = 0; budget > 0 && guard < 8; guard++) {
                if (chaser.path.length === 0) {
                    chaser.path = findPath(
                        chaser.tx,
                        chaser.ty,
                        Math.floor((player.x + player.w/2)/size),
                        Math.floor((player.y + player.h/2)/size)
                    );
                    if (chaser.path.length === 0) {
                        break;
                    };
                };
                const next = chaser.path[0];
                const targetX = next[0]*size;
                const targetY = next[1]*size;
                const dx = targetX - chaser.x;
                const dy = targetY - chaser.y;
                const dist = Math.hypot(dx,dy);

                if (dist <= budget) {
                    chaser.x = targetX;
                    chaser.y = targetY;
                    chaser.tx = next[0];
                    chaser.ty = next[1];
                    chaser.path = [];   // 1マス進むごとに、経路を取り直す
                    budget -= dist;
                } else {
                    chaser.x += dx/dist*budget;
                    chaser.y += dy/dist*budget;
                    budget = 0;
                };
            };
        };

        const runAction = (data) => {
            // 閉じ込められている間は開かない
            if (data.blockedIf && gameData.flags[data.blockedIf]) {
                showMessage(data.blockedMessage || "ドアが開かない……");
                sound.locked();
                return;
            };

            // 必要な物を持っていなければ開かない
            if (data.requires && !gameData.items[data.requires]) {
                showMessage(data.lockedMessage || "ドアには鍵がかかっている……");
                sound.locked();
                return;
            };

            // 鍵を使ったら持ち物欄からは消す。内部的には持ったままなので、その後も出入りできる
            if (data.requires && !gameData.used[data.requires]) {
                gameData.used[data.requires] = true;
                updateItemHud();
            };

            if (data.message) {
                showMessage(data.message);
            };
            if (data.sound) {
                sound[data.sound]();
            };
            if (data.show) {
                Object.values(npcs).flat().filter((npc) => npc.id === data.show).forEach((npc) => {
                    npc.visible = true;
                });
            };
            if (data.toMap) {
                const prevMap = gameData.mapId;
                gameData.mapId = data.toMap;
                player.x = data.x;
                player.y = data.y;

                // 応接室を、壁が壊れたあとに一度出て、また戻ってくると、音楽室の鍵が現れる
                if (prevMap === 10 && receptionEvent.phase === 3) {
                    gameData.flags.receptionLeft = true;
                };
                if (data.toMap === 10 && gameData.flags.receptionLeft) {
                    gameData.flags.musicKeyShown = true;
                };
            };
            if (data.toMap) {
                chaserFollowPlayer();
            };
            if (data.event) {
                events[data.event]();
            };
        };

        const key = {
            up:false,
            down:false,
            right:false,
            left:false
        };

        document.addEventListener("keydown",(event) => {
            switch (event.key) {
                case "ArrowUp":
                    key.up = true
                    break;
                case "ArrowDown":
                    key.down = true
                    break;
                case "ArrowRight":
                    key.right = true
                    break;
                case "ArrowLeft":
                    key.left = true
                    break;
            };
        });

        document.addEventListener("keyup",(event) => {
            switch (event.key) {
                case "ArrowUp":
                    key.up = false;
                    break;
                case "ArrowDown":
                    key.down = false;
                    break;
                case "ArrowRight":
                    key.right = false;
                    break;
                case "ArrowLeft":
                    key.left = false;
                    break;
            };
        });

        // 最初に触れた位置を基準に、一番近い上下左右へ動かす(下半分で操作、離すとリセット)
        const stick = {
            id:null,
            originX:0,
            originY:0,
            radius:60,
            deadZone:12,
            base:document.getElementById("stickBase"),
            knob:document.getElementById("stickKnob")
        };

        const setStick = (x,y,visible) => {
            stick.base.hidden = !visible;
            stick.knob.hidden = !visible;
            stick.base.style.left = stick.originX + "px";
            stick.base.style.top = stick.originY + "px";
            stick.knob.style.left = x + "px";
            stick.knob.style.top = y + "px";
        };

        const updateStick = (x,y) => {
            const dx = x - stick.originX;
            const dy = y - stick.originY;
            const dist = Math.hypot(dx,dy);

            key.up = key.down = key.left = key.right = false;
            if (dist >= stick.deadZone) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    key.right = dx > 0;
                    key.left = dx < 0;
                } else {
                    key.down = dy > 0;
                    key.up = dy < 0;
                };
            };

            // つまみは円の外に出ないようにする
            const rate = dist > stick.radius ? stick.radius/dist : 1;
            setStick(stick.originX + dx*rate,stick.originY + dy*rate,true);
        };

        const releaseStick = () => {
            stick.id = null;
            key.up = key.down = key.left = key.right = false;
            setStick(0,0,false);
        };

        document.addEventListener("pointerdown",(event) => {
            if (gameData.over || gameData.piano || gameData.lever || stick.id !== null || event.clientY < window.innerHeight/2) {
                return;
            };
            stick.id = event.pointerId;
            stick.originX = event.clientX;
            stick.originY = event.clientY;
            updateStick(event.clientX,event.clientY);
        });

        document.addEventListener("pointermove",(event) => {
            if (event.pointerId === stick.id) {
                updateStick(event.clientX,event.clientY);
            };
        });

        document.addEventListener("pointerup",(event) => {
            if (event.pointerId === stick.id) {
                releaseStick();
            };
        });

        document.addEventListener("pointercancel",(event) => {
            if (event.pointerId === stick.id) {
                releaseStick();
            };
        });

        // 1ピクセルずつ進めて壁に当たったら止める(フレームが飛んでも壁を抜けない)
        const visibleNpcs = () => (npcs[gameData.mapId] || []).filter((npc) => npc.visible);

        const collidesWithNpc = (entity) => visibleNpcs().some((npc) =>
            entity.x < npc.x + npc.w && entity.x + entity.w > npc.x
            && entity.y < npc.y + npc.h && entity.y + entity.h > npc.y
        );

        const isBlockedAt = (x,y) => {
            const saveX = player.x;
            const saveY = player.y;
            player.x = x;
            player.y = y;
            const blocked = getBlockingTiles(player).length > 0 || collidesWithNpc(player);
            player.x = saveX;
            player.y = saveY;
            return blocked;
        };

        // ぶつかった先に、少しずれた位置からなら通れるすき間があれば、1ピクセルずつそちらへ寄せる
        const nudgeMax = 8;

        const findNudge = (dx,dy) => {
            for (let k = 1; k <= nudgeMax; k++) {
                for (const sign of [-1,1]) {
                    const offsetX = dy !== 0 ? sign*k : 0;
                    const offsetY = dx !== 0 ? sign*k : 0;
                    if (!isBlockedAt(player.x + dx + offsetX,player.y + dy + offsetY)) {
                        return {x:Math.sign(offsetX),y:Math.sign(offsetY)};
                    };
                };
            };
            return null;
        };

        const movePlayer = (dx,dy,steps) => {
            for (let i = 0; i < steps; i++) {
                player.x += dx;
                player.y += dy;
                const tiles = getBlockingTiles(player);
                if (tiles.length > 0 || collidesWithNpc(player)) {
                    player.x -= dx;
                    player.y -= dy;

                    const nudge = findNudge(dx,dy);
                    if (nudge && !isBlockedAt(player.x + nudge.x,player.y + nudge.y)) {
                        player.x += nudge.x;
                        player.y += nudge.y;
                        continue;
                    };
                    return tiles;
                };
            };
            return [];
        };

        // 毒液SPを持って正門に触れたとき: 先生が現れるが、毒液が自動で使われて倒れ、脱出できる
        const clearScreen = document.getElementById("clearScreen");
        const clearAgain = document.getElementById("clearAgain");

        const escapeSequence = () => {
            const later = (func,ms) => puzzle.timers.push(setTimeout(func,ms));
            const shake = () => {
                canvas.classList.add("shake");
                later(() => {
                    canvas.classList.remove("shake");
                },500);
            };

            gameData.clearing = true;
            gameData.frozen = true;
            key.up = key.down = key.left = key.right = false;
            releaseStick();
            delete gameData.items.poisonSP;
            updateItemHud();

            sound.sting();
            shake();
            showMessage("正門に手をかけた……！ 先生が現れた！");
            if (!chaser.active) {
                startChase(9,18,49,0.2,0.8);
            };

            later(() => {
                sound.pickup();
                shake();
                showMessage("持っていた「強力な毒液SP」が、先生にふりかかった！",2500);
            },1200);

            later(() => {
                chaser.active = false;
                sound.caught();
                shake();
                showMessage("先生は、苦しみながら消えていった……",2500);
            },2800);

            later(() => {
                sound.open();
                showMessage("正門が、ゆっくりと開いた。",2500);
            },5000);

            later(() => {
                messageBox.hidden = true;
                gameData.over = true;
                clearScreen.classList.add("show");
                sound.clear();
                later(() => {
                    clearAgain.disabled = false;
                    clearAgain.focus();
                },2000);
            },7000);
        };

        // 暗転 → GAME OVER → againで最初から
        const gameOverScreen = document.getElementById("gameOver");
        const againButton = document.getElementById("againButton");

        const isNear = (a,b,margin) => a.x < b.x + b.w + margin && a.x + a.w + margin > b.x
            && a.y < b.y + b.h + margin && a.y + a.h + margin > b.y;

        const gameOverReason = document.getElementById("gameOverReason");

        const startGameOver = (reason) => {
            gameData.over = true;
            gameOverReason.textContent = reason;
            key.up = key.down = key.left = key.right = false;
            releaseStick();
            messageBox.hidden = true;
            sound.caught();

            // 捕まった瞬間に操作を止め、画面を揺らしてから暗転する
            canvas.classList.add("shake");
            setTimeout(() => {
                canvas.classList.remove("shake");
                gameOverScreen.classList.add("show");
                sound.gameOver();

                // 暗転しきってから押せるようにする
                setTimeout(() => {
                    againButton.disabled = false;
                    againButton.focus();
                },1200);
            },500);
        };

        const restart = () => {
            sound.again();
            gameData.mapId = 1;
            player.x = startState.x;
            player.y = startState.y;
            Object.values(npcs).flat().forEach((npc) => {
                npc.visible = false;
            });
            Object.values(mapItems).flat().forEach((item) => {
                item.taken = false;
            });
            gameData.items = {};
            gameData.used = {};
            gameData.flags = {};
            newMelody();
            closePiano();
            gameData.frozen = false;
            gameData.hidden = false;
            chaser.active = false;
            chaser.waiting = 0;
            clearTimeout(hideTimer);
            stopRing();
            clearTimeout(receptionEvent.breakTimer);
            receptionEvent.phase = 0;
            mapData[10] = receptionRoom.slice();
            mapData[11] = musicRoom.slice();
            mapData[15] = labRoom.slice();
            mapData[16] = labRoom2.slice();
            mapData[17] = nurseRoom.slice();
            clearTimeout(lever.timer);
            closeLever();
            newLever();
            doorData[11]["6,10"] = {message:"肖像画"};
            clearTimeout(puzzle.timer);
            puzzle.timers.forEach(clearTimeout);
            puzzle.timers = [];
            canvas.classList.remove("shake");
            updateItemHud();
            moveRemain = 0;
            againButton.disabled = true;
            gameOverScreen.classList.remove("show");
            clearScreen.classList.remove("show");
            clearAgain.disabled = true;
            gameData.clearing = false;
            gameData.over = false;
        };

        againButton.addEventListener("click",restart);
        clearAgain.addEventListener("click",restart);

        // 【一時的・配布前に削除】デバッグ用: F12のコンソールで warp(マップID) と入力すると、そのマップへ移動する
        // warp(マップID, タイルx, タイルy) で位置も指定できる。ID: 1教室 2三階 3二階 4一階 5校庭 6渡り廊下 7三年下駄箱 8職員室 9外 10応接室 11音楽室 12図書室 13東校舎 14三年校舎2階 15第一理科室 16第二理科室 17保健室
        const warpSpots = {
            1:[12,16],
            2:[4,28],
            3:[4,28],
            4:[11,28],
            5:[6,2],
            6:[1,1],
            7:[1,8],
            8:[12,16],
            9:[5,2],
            10:[12,2],
            11:[6,1],
            12:[10,1],
            13:[3,1],
            14:[3,1],
            15:[2,12],
            16:[11,1],
            17:[12,2]
        };

        const warp = (mapId,tx,ty) => {
            if (!mapData[mapId]) {
                console.log("マップIDは次のとおり: " + Object.keys(mapData).join(", "));
                return;
            };
            if (gameData.over) {
                console.log("ゲームオーバー中は again を押してから移動してください");
                return;
            };

            const spot = warpSpots[mapId] || [1,1];
            gameData.mapId = mapId;
            player.x = (tx === undefined ? spot[0] : tx)*config.tileSize;
            player.y = (ty === undefined ? spot[1] : ty)*config.tileSize;
            chaserFollowPlayer();
            if (isColliding(player)) {
                console.log("そこは壁の中です。別の位置を指定してください");
            };
        };

        // 【一時的・配布前に削除】デバッグ用: F12のコンソールで cheat() と入力すると、移動とアイテムの付与ができる簡易パネルが出る
        // コンソールから直接 give("musicKey") のようにも使える
        const mapNames = {
            1:"教室(3階)",
            2:"3階の廊下",
            3:"2階の廊下",
            4:"1階の廊下",
            5:"校庭(草の広場)",
            6:"渡り廊下(T字)",
            7:"3年校舎1階の廊下",
            8:"職員室",
            9:"外(石畳・正門)",
            10:"応接室",
            11:"音楽室",
            12:"図書室",
            13:"東校舎",
            14:"3年校舎2階の廊下",
            15:"第一理科室",
            16:"第二理科室",
            17:"保健室"
        };

        const cheatPanel = document.getElementById("cheat");
        const cheatSelect = document.getElementById("cheatMap");
        const cheatItemList = document.getElementById("cheatItems");
        let cheatBuilt = false;

        // 操作したあとはフォーカスを外す(開いたままでも、矢印キーでプレイヤーを動かせるように)
        const blurActive = () => {
            const element = document.activeElement;
            if (element && element.blur) {
                element.blur();
            };
        };

        const give = (id) => {
            if (!itemDefs[id]) {
                console.log("アイテムIDは次のとおり: " + Object.keys(itemDefs).join(", "));
                return;
            };
            gameData.items[id] = true;
            delete gameData.used[id];
            const labFlags = {liquidX:"takenLiquidX",keyMold:"takenKeyMold",softMetal:"takenSoftMetal",liquidY:"takenLiquidY",medicineZ:"takenMedicineZ"};
            if (labFlags[id]) {
                gameData.flags[labFlags[id]] = true;
                syncLab();
                syncLab2();
                syncNurse();
            };
            Object.values(mapItems).flat().filter((item) => item.id === id).forEach((item) => {
                item.taken = true;
            });
            updateItemHud();
        };

        const cheat = () => {
            if (!cheatBuilt) {
                cheatBuilt = true;
                for (const id in mapNames) {
                    const option = document.createElement("option");
                    option.value = id;
                    option.textContent = id + ": " + mapNames[id];
                    cheatSelect.appendChild(option);
                };
                for (const id in itemDefs) {
                    const button = document.createElement("button");
                    const name = itemDefs[id].name;
                    button.textContent = typeof name === "function" ? name() : name;
                    button.addEventListener("click",() => {
                        give(id);
                        blurActive();
                    });
                    cheatItemList.appendChild(button);
                };
                document.getElementById("cheatWarp").addEventListener("click",() => {
                    warp(Number(cheatSelect.value));
                    blurActive();
                });
                document.getElementById("cheatClear").addEventListener("click",() => {
                    gameData.items = {};
                    gameData.used = {};
                    updateItemHud();
                    blurActive();
                });
                document.getElementById("cheatClose").addEventListener("click",cheat);
                cheatSelect.addEventListener("change",blurActive);
                // パネルの操作で、プレイヤーのスティックが動かないようにする
                cheatPanel.addEventListener("pointerdown",(event) => event.stopPropagation());
            };
            cheatPanel.hidden = !cheatPanel.hidden;
        };

        let lastTime = null;
        let moveRemain = 0;
        let stepDistance = 40;

        const gameLoop = (time) => {

            // タブ切り替え後などで一気に進まないよう、経過時間に上限を付ける
            const delta = lastTime === null ? 0 : Math.min((time - lastTime)/1000,0.05);
            lastTime = time;

            if (!gameData.over) {
                // 電話中・ロッカーに隠れている間は動けない
                if (gameData.frozen) {
                    moveRemain = 0;
                } else {
                    moveRemain += player.speed*delta;
                };
                const steps = Math.floor(moveRemain);
                moveRemain -= steps;

                const beforeX = player.x;
                const beforeY = player.y;
                let touched = [];
                if (key.up) {
                    touched = movePlayer(0,-1,steps);
                } else if (key.down) {
                    touched = movePlayer(0,1,steps);
                } else if (key.right) {
                    touched = movePlayer(1,0,steps);
                } else if (key.left) {
                    touched = movePlayer(-1,0,steps);
                };
                // 一定距離ごとに足音を鳴らす
                const moved = Math.abs(player.x - beforeX) + Math.abs(player.y - beforeY);
                if (moved > 0) {
                    stepDistance += moved;
                    if (stepDistance >= 48) {
                        stepDistance = 0;
                        sound.step();
                    };
                } else {
                    stepDistance = 40;
                };

                touchDoor(touched);
                checkStep();
                checkPickup();
                checkPhone();

                updateChaser(delta);
                if (chaserVisible() && !gameData.hidden && !gameData.clearing && isNear(player,chaser,0)) {
                    startGameOver(chaser.reason);
                };

                const catcher = visibleNpcs().find((npc) => npc.catches && isNear(player,npc,2));
                if (catcher) {
                    startGameOver(catcher.reason);
                };
            };

            updateCamera();
            drawMap(gameData.mapId);
            (mapItems[gameData.mapId] || []).filter(itemVisible).forEach(drawEntity);
            visibleNpcs().forEach(drawEntity);
            if (chaserVisible()) {
                drawEntity(chaser);
            };
            if (!gameData.hidden) {
                drawEntity(player);
            };

            requestAnimationFrame(gameLoop);
        };

        requestAnimationFrame(gameLoop);

    </script>

</body>
