<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクールエスケープ</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: min(100vw, 100vh);
            height: min(100vw, 100vh);
            image-rendering: pixelated;
        }

        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .stick {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.3;
            transform: translate(-50%, -50%);
        }

        #stickBase {
            width: 120px;
            height: 120px;
            background: #888888;
            border: 3px solid #000000;
        }

        #message {
            position: fixed;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            max-width: 90vw;
            padding: 10px 18px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            font-size: min(5vw, 22px);
            text-align: center;
            pointer-events: none;
        }

        canvas.shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%   { transform: translate(0, 0); }
            10%  { transform: translate(-10px, 5px); }
            20%  { transform: translate(9px, -6px); }
            30%  { transform: translate(-8px, -4px); }
            40%  { transform: translate(8px, 6px); }
            50%  { transform: translate(-6px, 3px); }
            60%  { transform: translate(6px, -3px); }
            70%  { transform: translate(-4px, 2px); }
            80%  { transform: translate(3px, -2px); }
            90%  { transform: translate(-2px, 1px); }
            100% { transform: translate(0, 0); }
        }

        #gameOver {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: #000000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s;
        }

        #gameOver.show {
            opacity: 1;
            pointer-events: auto;
        }

        #gameOverText {
            color: #cc2222;
            font-size: min(10vw, 56px);
            letter-spacing: 0.1em;
        }

        #gameOverReason {
            max-width: 90vw;
            color: #ffffff;
            font-size: min(4.5vw, 22px);
            text-align: center;
        }

        #againButton {
            padding: 10px 36px;
            border: 3px solid #ffffff;
            background: #000000;
            color: #ffffff;
            font-size: min(6vw, 28px);
            cursor: pointer;
        }

        #againButton:disabled {
            opacity: 0.3;
            cursor: default;
        }

        #stickKnob {
            width: 50px;
            height: 50px;
            background: #000000;
        }
    </style>
</head>

                    if (!AudioCtx) {
                        return;
                    };
                    this.ctx = new AudioCtx();
                };
                if (this.ctx.state === "suspended") {

            tone(type,startFreq,endFreq,delay,duration,volume = this.volume) {
                if (!this.ctx) {
                    return;
                };
                const start = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(startFreq,start);
                osc.frequency.exponentialRampToValueAtTime(endFreq,start + duration);
                gain.gain.setValueAtTime(volume,start);
                gain.gain.exponentialRampToValueAtTime(0.001,start + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(start);
                osc.stop(start + duration);
            },

            };
        });

        // 最初に触れた位置を基準に、一番近い上下左右へ動かす(下半分で操作、離すとリセット)
        const stick = {
            id:null,
            originX:0,
            originY:0,
            radius:60,
            deadZone:12,
            base:document.getElementById("stickBase"),
            knob:document.getElementById("stickKnob")
        };

        const setStick = (x,y,visible) => {
            stick.base.hidden = !visible;
            stick.knob.hidden = !visible;
            stick.base.style.left = stick.originX + "px";
            stick.base.style.top = stick.originY + "px";
            stick.knob.style.left = x + "px";
            stick.knob.style.top = y + "px";
        };

        const updateStick = (x,y) => {
            const dx = x - stick.originX;
            const dy = y - stick.originY;
            const dist = Math.hypot(dx,dy);

            key.up = key.down = key.left = key.right = false;
            if (dist >= stick.deadZone) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    key.right = dx > 0;
                    key.left = dx < 0;
                } else {
                    key.down = dy > 0;
                    key.up = dy < 0;
                };
            };

            // つまみは円の外に出ないようにする
            const rate = dist > stick.radius ? stick.radius/dist : 1;
            setStick(stick.originX + dx*rate,stick.originY + dy*rate,true);
        };

        const releaseStick = () => {
            stick.id = null;
            key.up = key.down = key.left = key.right = false;
            setStick(0,0,false);
        };

        document.addEventListener("pointerdown",(event) => {
            if (gameData.over || stick.id !== null || event.clientY < window.innerHeight/2) {
                return;
            };
            stick.id = event.pointerId;
            stick.originX = event.clientX;
            stick.originY = event.clientY;
            updateStick(event.clientX,event.clientY);
        });

        document.addEventListener("pointermove",(event) => {
            if (event.pointerId === stick.id) {
                updateStick(event.clientX,event.clientY);
            };
        });

        document.addEventListener("pointerup",(event) => {
            if (event.pointerId === stick.id) {
                releaseStick();
            };
        });

        document.addEventListener("pointercancel",(event) => {
            if (event.pointerId === stick.id) {
                releaseStick();
            };
        });

        // 1ピクセルずつ進めて壁に当たったら止める(フレームが飛んでも壁を抜けない)
        const visibleNpcs = () => (npcs[gameData.mapId] || []).filter((npc) => npc.visible);

        const collidesWithNpc = (entity) => visibleNpcs().some((npc) =>
            entity.x < npc.x + npc.w && entity.x + entity.w > npc.x
            && entity.y < npc.y + npc.h && entity.y + entity.h > npc.y
        );

        const movePlayer = (dx,dy,steps) => {
            for (let i = 0; i < steps; i++) {
                player.x += dx;
                player.y += dy;
                const tiles = getBlockingTiles(player);
                if (tiles.length > 0 || collidesWithNpc(player)) {
                    player.x -= dx;
                    player.y -= dy;
                    return tiles;
                };
            };
            return [];
        };

        // 暗転 → GAME OVER → againで最初から
        const gameOverScreen = document.getElementById("gameOver");
        const againButton = document.getElementById("againButton");

        const isNear = (a,b,margin) => a.x < b.x + b.w + margin && a.x + a.w + margin > b.x
            && a.y < b.y + b.h + margin && a.y + a.h + margin > b.y;

        const gameOverReason = document.getElementById("gameOverReason");

        const startGameOver = (reason) => {
            gameData.over = true;
            gameOverReason.textContent = reason;
            key.up = key.down = key.left = key.right = false;
            releaseStick();
            messageBox.hidden = true;
            sound.caught();

            // 捕まった瞬間に操作を止め、画面を揺らしてから暗転する
            canvas.classList.add("shake");
            setTimeout(() => {
                canvas.classList.remove("shake");
                gameOverScreen.classList.add("show");
                sound.gameOver();

                // 暗転しきってから押せるようにする
                setTimeout(() => {
                    againButton.disabled = false;
                    againButton.focus();
                },1200);
            },500);
        };

        const restart = () => {
            sound.again();
            gameData.mapId = 1;
            player.x = startState.x;
            player.y = startState.y;
            Object.values(npcs).flat().forEach((npc) => {
                npc.visible = false;
            });
            moveRemain = 0;
            againButton.disabled = true;
            gameOverScreen.classList.remove("show");
            gameData.over = false;
        };

        againButton.addEventListener("click",restart);

        // 【一時的・配布前に削除】デバッグ用: F12のコンソールで warp(マップID) と入力すると、そのマップへ移動する
        // warp(マップID, タイルx, タイルy) で位置も指定できる。ID: 1教室 2三階 3二階 4一階 5校庭 6渡り廊下 7三年下駄箱 8職員室 9外
        const warpSpots = {
            1:[12,16],
            2:[4,28],
            3:[4,28],
            4:[11,28],
            5:[6,2],
            6:[1,1],
            7:[1,8],
            8:[12,16],
            9:[5,2]
        };

        const warp = (mapId,tx,ty) => {
            if (!mapData[mapId]) {
                console.log("マップIDは次のとおり: " + Object.keys(mapData).join(", "));
                return;
            };
            if (gameData.over) {
                console.log("ゲームオーバー中は again を押してから移動してください");
                return;
            };

            const spot = warpSpots[mapId] || [1,1];
            gameData.mapId = mapId;
            player.x = (tx === undefined ? spot[0] : tx)*config.tileSize;
            player.y = (ty === undefined ? spot[1] : ty)*config.tileSize;
            if (isColliding(player)) {
                console.log("そこは壁の中です。別の位置を指定してください");
            };
        };

        let lastTime = null;
        let moveRemain = 0;
        let stepDistance = 40;

        const gameLoop = (time) => {

            // タブ切り替え後などで一気に進まないよう、経過時間に上限を付ける
            const delta = lastTime === null ? 0 : Math.min((time - lastTime)/1000,0.05);
            lastTime = time;

            if (!gameData.over) {
                moveRemain += player.speed*delta;
                const steps = Math.floor(moveRemain);
                moveRemain -= steps;

                const beforeX = player.x;
                const beforeY = player.y;
                let touched = [];
                if (key.up) {
                    touched = movePlayer(0,-1,steps);
                } else if (key.down) {
                    touched = movePlayer(0,1,steps);
                } else if (key.right) {
                    touched = movePlayer(1,0,steps);
                } else if (key.left) {
                    touched = movePlayer(-1,0,steps);
                };
                // 一定距離ごとに足音を鳴らす
                const moved = Math.abs(player.x - beforeX) + Math.abs(player.y - beforeY);
                if (moved > 0) {
                    stepDistance += moved;
                    if (stepDistance >= 48) {
                        stepDistance = 0;
                        sound.step();
                    };
                } else {
                    stepDistance = 40;
                };

                touchDoor(touched);
                checkStep();

                const catcher = visibleNpcs().find((npc) => npc.catches && isNear(player,npc,2));
                if (catcher) {
                    startGameOver(catcher.reason);
                };
            };

            updateCamera();
            drawMap(gameData.mapId);
            visibleNpcs().forEach(drawEntity);
            drawEntity(player);

            requestAnimationFrame(gameLoop);
        };

        requestAnimationFrame(gameLoop);

    </script>

</body>
