<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクールエスケープ</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: min(100vw, 100vh);
            height: min(100vw, 100vh);
            image-rendering: pixelated;
        }

        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .stick {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.3;
            transform: translate(-50%, -50%);
        }

        #stickBase {
            width: 120px;
            height: 120px;
            background: #888888;
            border: 3px solid #000000;
        }

        #message {
            position: fixed;
            top: 6%;
            left: 50%;
            transform: translateX(-50%);
            max-width: 90vw;
            padding: 10px 18px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            font-size: min(5vw, 22px);
            text-align: center;
            pointer-events: none;
        }

        #stickKnob {
            width: 50px;
            height: 50px;
            background: #000000;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="message" hidden></div>
    <div id="stickBase" class="stick" hidden></div>
    <div id="stickKnob" class="stick" hidden></div>

    <script>

        const config = {
            canvas:{
                width:256,
                height:256
            },
            tileSize:16
        };

        const colorTable = {
            0:"#ffffff",
            1:"#000000",
            2:"#c0702a",//ドアの板
            3:"#ffd700",//ドアノブ
            4:"#ffcc99",//肌
            5:"#3f7fd9",//制服
            6:"#2a3a6b",//ズボン
            8:"#f5e6c8",//床
            9:"#d8c496",//床の点
            a:"#cfd8dc",//壁
            b:"#c68642",//机の天板
            c:"#1f5c3a",//黒板
            e:"#8b5a2b",//黒板の枠
            f:"#8fd0f5"//窓ガラス
        };

        // 色番号の "." は透明

        // 1行=16文字の文字列で持つ(配布時の軽量化のため)
        const tileData = {
            0:[//floor
                "9888888888888888",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888",

                "8888888888888888",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888"
            ],
            1:[//wall
                "1111111111111111",
                "1aaaaaaaaaaaaaa1",
                "1a111111111111a1",
                "1a1aaaaaaaaaa1a1",
                "1a1aaaaaaaaaa1a1",
                "1a1aaaaaaaaaa1a1",
                "1a1aaaaaaaaaa1a1",
                "1a1aaaaaaaaaa1a1",
                "1a1aaaaaaaaaa1a1",
                "1a1aaaaaaaaaa1a1",
                "1a1aaaaaaaaaa1a1",
                "1a1aaaaaaaaaa1a1",
                "1a1aaaaaaaaaa1a1",
                "1a111111111111a1",
                "1aaaaaaaaaaaaaa1",
                "1111111111111111"
            ],
            2:[//void
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111"
            ],
            3:[//desk
                "8888888888888888",
                "8888888888888888",
                "8111111111111118",
                "81bbbbbbbbbbbb18",
                "81bbbbbbbbbbbb18",
                "81bbbbbbbbbbbb18",
                "81bbbbbbbbbbbb18",
                "8111111111111118",
                "8881888888881888",
                "8881888888881888",
                "8881888888881888",
                "8881888888881888",
                "8881888888881888",
                "8881888888881888",
                "8888888888888888",
                "8888888888888888"
            ],
            4:[//blackboard
                "8888888888888888",
                "eeeeeeeeeeeeeeee",
                "eeeeeeeeeeeeeeee",
                "cccccccccccccccc",
                "cccccccccccccccc",
                "cccccc00cccccccc",
                "ccccccccccc00ccc",
                "cccccccccccccccc",
                "ccc00ccccccccccc",
                "cccccccccccccccc",
                "cccccccccccccccc",
                "eeeeeeeeeeeeeeee",
                "eeeeeeeeeeeeeeee",
                "8888888888888888",
                "8888888888888888",
                "8888888888888888"
            ],
            5:[//door
                "1111111111111111",
                "1222222222222221",
                "1211111111111121",
                "1212222222222121",
                "1212222222222121",
                "1212222222222121",
                "1212222222222121",
                "1212222222222121",
                "1212222222233121",
                "1212222222233121",
                "1212222222222121",
                "1212222222222121",
                "1212222222222121",
                "1212222222222121",
                "1211111111111121",
                "1222222222222221"
            ],
            6:[//window
                "1111111111111111",
                "1aaaaaaaaaaaaaa1",
                "1a111111111111a1",
                "1a1ffff11ffff1a1",
                "1a1ffff11ffff1a1",
                "1a1ffff11ffff1a1",
                "1a1ffff11ffff1a1",
                "1a111111111111a1",
                "1a1ffff11ffff1a1",
                "1a1ffff11ffff1a1",
                "1a1ffff11ffff1a1",
                "1a1ffff11ffff1a1",
                "1a111111111111a1",
                "1aaaaaaaaaaaaaa1",
                "1111111111111111",
                "1111111111111111"
            ]
        };

        // 通れないタイル(floor以外)
        const solidTiles = new Set([1,2,3,4,5,6]);

        // 1行=1文字1タイルの文字列。縦横のサイズはマップごとに自由
        const mapData = {
            1:[//classroom
                "11111111111111",
                "10044444444001",
                "10000333300001",
                "10000000000005",
                "60000000000001",
                "10300300300301",
                "10000000000001",
                "60000000000001",
                "10300300300301",
                "10000000000001",
                "60000000000001",
                "10300300300301",
                "10000000000001",
                "60000000000001",
                "10300300300301",
                "10000000000001",
                "10000000000005",
                "10000444400001",
                "11111111111111"
            ],
            2:[//hallway(ドアの高さは教室と同じ)
                "1111111",
                "1000001",
                "1000001",
                "5000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "5000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1000001",
                "1111111"
            ]
        };

        // ドアに触れたときの動作。キーは「マップID」→「x,y」(タイル座標)
        const doorData = {
            1:{
                "13,3":{message:"ドアには鍵がかかっている……"},
                "13,16":{message:"鍵を開けて、外に出た。",toMap:2,x:16,y:256}
            },
            2:{
                "0,3":{message:"ドアには鍵がかかっている……"},
                "0,16":{message:"教室に戻った。",toMap:1,x:192,y:256}
            }
        };

        const player = {
            x:192,
            y:256,
            w:16,
            h:16,
            speed:180,//1秒あたりのピクセル数(11.25タイル/秒)
            tex:[
                "................",
                ".....111111.....",
                "....11111111....",
                "....11111111....",
                "....14444441....",
                "....14144141....",
                "....14444441....",
                "....14411441....",
                ".....111111.....",
                "...1155555511...",
                "..115555555511..",
                "..145555555541..",
                "...1555555551...",
                "...1166666611...",
                "....16611661....",
                "....11....11...."
            ]
        };

        const gameData = {
            mapId:1
        };

        const camera = {
            x:0,
            y:0
        };

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = config.canvas.width;
        canvas.height = config.canvas.height;

        // 文字列のドット絵を一度だけ描いておき、毎フレームはそれをコピーする
        const makeTexture = (rows) => {
            const tex = document.createElement("canvas");
            tex.width = config.tileSize;
            tex.height = config.tileSize;
            const texCtx = tex.getContext("2d");

            for (let py = 0; py < rows.length; py++) {
                for (let px = 0; px < rows[py].length; px++) {
                    const color = colorTable[rows[py][px]];
                    if (color) {
                        texCtx.fillStyle = color;
                        texCtx.fillRect(px,py,1,1);
                    };
                };
            };
            return tex;
        };

        const tileTextures = {};
        for (const id in tileData) {
            tileTextures[id] = makeTexture(tileData[id]);
        };
        player.texture = makeTexture(player.tex);

        // マップ外は壁として扱う
        const getTile = (tx,ty) => {
            const row = mapData[gameData.mapId][ty];
            if (row === undefined || tx < 0 || tx >= row.length) {
                return 1;
            };
            return Number(row[tx]);
        };

        const updateCamera = () => {
            const map = mapData[gameData.mapId];
            const maxX = map[0].length*config.tileSize - config.canvas.width;
            const maxY = map.length*config.tileSize - config.canvas.height;

            // マップが画面より小さい場合は中央に置く
            camera.x = maxX <= 0 ? Math.floor(maxX/2) : Math.max(0,Math.min(maxX,player.x + player.w/2 - config.canvas.width/2));
            camera.y = maxY <= 0 ? Math.floor(maxY/2) : Math.max(0,Math.min(maxY,player.y + player.h/2 - config.canvas.height/2));
        };

        const drawMap = (mapId) => {

            const map = mapData[mapId];
            const size = config.tileSize;

            ctx.fillStyle = colorTable[1];
            ctx.fillRect(0,0,config.canvas.width,config.canvas.height);

            // 画面に映る範囲のタイルだけ描く
            const startX = Math.max(0,Math.floor(camera.x/size));
            const startY = Math.max(0,Math.floor(camera.y/size));
            const endX = Math.ceil((camera.x + config.canvas.width)/size);
            const endY = Math.ceil((camera.y + config.canvas.height)/size);

            for (let ty = startY; ty < endY && ty < map.length; ty++) {
                for (let tx = startX; tx < endX && tx < map[ty].length; tx++) {
                    ctx.drawImage(
                        tileTextures[map[ty][tx]],
                        tx*size - camera.x,
                        ty*size - camera.y
                    );
                };
            };

        };

        const drawEntity = (entity) => {
            ctx.drawImage(
                entity.texture,
                entity.x - camera.x,
                entity.y - camera.y
            );
        };

        // 重なっている通れないタイルを、座標付きで返す
        const getBlockingTiles = (entity) => {
            const size = config.tileSize;
            const left = Math.floor(entity.x/size);
            const right = Math.floor((entity.x+entity.w-1)/size);
            const top = Math.floor(entity.y/size);
            const bottom = Math.floor((entity.y+entity.h-1)/size);
            const tiles = [];

            for (const [x,y] of [[left,top],[right,top],[left,bottom],[right,bottom]]) {
                const id = getTile(x,y);
                if (solidTiles.has(id)) {
                    tiles.push({x,y,id});
                };
            };
            return tiles;
        };

        const isColliding = (entity) => getBlockingTiles(entity).length > 0;

        // 効果音は音声ファイルを使わず、再生のたびに合成する
        const sound = {
            ctx:null,
            volume:1,
            lastLocked:0,

            unlock() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) {
                        return;
                    };
                    this.ctx = new AudioCtx();
                };
                if (this.ctx.state === "suspended") {
                    this.ctx.resume();
                };
            },

            tone(type,startFreq,endFreq,delay,duration) {
                if (!this.ctx) {
                    return;
                };
                const start = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(startFreq,start);
                osc.frequency.exponentialRampToValueAtTime(endFreq,start + duration);
                gain.gain.setValueAtTime(this.volume,start);
                gain.gain.exponentialRampToValueAtTime(0.001,start + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(start);
                osc.stop(start + duration);
            },

            step() {
                this.tone("triangle",420,200,0,0.07);
            },

            locked() {
                // 連続で鳴り続けないよう間隔を空ける
                const now = performance.now();
                if (now - this.lastLocked < 900) {
                    return;
                };
                this.lastLocked = now;
                this.tone("square",320,180,0,0.06);
                this.tone("square",320,180,0.1,0.06);
            },

            open() {
                this.tone("square",900,300,0,0.04);
                this.tone("triangle",330,660,0.1,0.25);
            }
        };

        // ブラウザの仕様で、音は最初の操作のあとでないと鳴らせない
        document.addEventListener("keydown",() => sound.unlock());
        document.addEventListener("pointerdown",() => sound.unlock());

        const messageBox = document.getElementById("message");
        let messageTimer = null;

        const showMessage = (text) => {
            messageBox.textContent = text;
            messageBox.hidden = false;
            clearTimeout(messageTimer);
            messageTimer = setTimeout(() => {
                messageBox.hidden = true;
            },2500);
        };

        const touchDoor = (tiles) => {
            const door = tiles.find((tile) => tile.id === 5);
            const data = door && (doorData[gameData.mapId] || {})[door.x + "," + door.y];
            if (!data) {
                return;
            };

            showMessage(data.message);
            if (!data.toMap) {
                sound.locked();
            } else {
                sound.open();
                gameData.mapId = data.toMap;
                player.x = data.x;
                player.y = data.y;
            };
        };

        const key = {
            up:false,
            down:false,
            right:false,
            left:false
        };

        document.addEventListener("keydown",(event) => {
            switch (event.key) {
                case "ArrowUp":
                    key.up = true
                    break;
                case "ArrowDown":
                    key.down = true
                    break;
                case "ArrowRight":
                    key.right = true
                    break;
                case "ArrowLeft":
                    key.left = true
                    break;
            };
        });

        document.addEventListener("keyup",(event) => {
            switch (event.key) {
                case "ArrowUp":
                    key.up = false;
                    break;
                case "ArrowDown":
                    key.down = false;
                    break;
                case "ArrowRight":
                    key.right = false;
                    break;
                case "ArrowLeft":
                    key.left = false;
                    break;
            };
        });

        // 最初に触れた位置を基準に、一番近い上下左右へ動かす(下半分で操作、離すとリセット)
        const stick = {
            id:null,
            originX:0,
            originY:0,
            radius:60,
            deadZone:12,
            base:document.getElementById("stickBase"),
            knob:document.getElementById("stickKnob")
        };

        const setStick = (x,y,visible) => {
            stick.base.hidden = !visible;
            stick.knob.hidden = !visible;
            stick.base.style.left = stick.originX + "px";
            stick.base.style.top = stick.originY + "px";
            stick.knob.style.left = x + "px";
            stick.knob.style.top = y + "px";
        };

        const updateStick = (x,y) => {
            const dx = x - stick.originX;
            const dy = y - stick.originY;
            const dist = Math.hypot(dx,dy);

            key.up = key.down = key.left = key.right = false;
            if (dist >= stick.deadZone) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    key.right = dx > 0;
                    key.left = dx < 0;
                } else {
                    key.down = dy > 0;
                    key.up = dy < 0;
                };
            };

            // つまみは円の外に出ないようにする
            const rate = dist > stick.radius ? stick.radius/dist : 1;
            setStick(stick.originX + dx*rate,stick.originY + dy*rate,true);
        };

        const releaseStick = () => {
            stick.id = null;
            key.up = key.down = key.left = key.right = false;
            setStick(0,0,false);
        };

        document.addEventListener("pointerdown",(event) => {
            if (stick.id !== null || event.clientY < window.innerHeight/2) {
                return;
            };
            stick.id = event.pointerId;
            stick.originX = event.clientX;
            stick.originY = event.clientY;
            updateStick(event.clientX,event.clientY);
        });

        document.addEventListener("pointermove",(event) => {
            if (event.pointerId === stick.id) {
                updateStick(event.clientX,event.clientY);
            };
        });

        document.addEventListener("pointerup",(event) => {
            if (event.pointerId === stick.id) {
                releaseStick();
            };
        });

        document.addEventListener("pointercancel",(event) => {
            if (event.pointerId === stick.id) {
                releaseStick();
            };
        });

        // 1ピクセルずつ進めて壁に当たったら止める(フレームが飛んでも壁を抜けない)
        const movePlayer = (dx,dy,steps) => {
            for (let i = 0; i < steps; i++) {
                player.x += dx;
                player.y += dy;
                const tiles = getBlockingTiles(player);
                if (tiles.length > 0) {
                    player.x -= dx;
                    player.y -= dy;
                    return tiles;
                };
            };
            return [];
        };

        let lastTime = null;
        let moveRemain = 0;
        let stepDistance = 40;

        const gameLoop = (time) => {

            // タブ切り替え後などで一気に進まないよう、経過時間に上限を付ける
            const delta = lastTime === null ? 0 : Math.min((time - lastTime)/1000,0.05);
            lastTime = time;

            moveRemain += player.speed*delta;
            const steps = Math.floor(moveRemain);
            moveRemain -= steps;

            const beforeX = player.x;
            const beforeY = player.y;
            let touched = [];
            if (key.up) {
                touched = movePlayer(0,-1,steps);
            } else if (key.down) {
                touched = movePlayer(0,1,steps);
            } else if (key.right) {
                touched = movePlayer(1,0,steps);
            } else if (key.left) {
                touched = movePlayer(-1,0,steps);
            };
            // 一定距離ごとに足音を鳴らす
            const moved = Math.abs(player.x - beforeX) + Math.abs(player.y - beforeY);
            if (moved > 0) {
                stepDistance += moved;
                if (stepDistance >= 48) {
                    stepDistance = 0;
                    sound.step();
                };
            } else {
                stepDistance = 40;
            };

            touchDoor(touched);

            updateCamera();
            drawMap(gameData.mapId);
            drawEntity(player);

            requestAnimationFrame(gameLoop);
        };

        requestAnimationFrame(gameLoop);

    </script>

</body>

</html>
