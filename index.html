<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スクールエスケープ</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: min(100vw, 100vh);
            height: min(100vw, 100vh);
            image-rendering: pixelated;
        }

        body {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .stick {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.3;
            transform: translate(-50%, -50%);
        }

        #stickBase {
            width: 120px;
            height: 120px;
            background: #888888;
            border: 3px solid #000000;
        }

        #stickKnob {
            width: 50px;
            height: 50px;
            background: #000000;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="stickBase" class="stick" hidden></div>
    <div id="stickKnob" class="stick" hidden></div>

    <script>

        const config = {
            canvas:{
                width:256,
                height:256
            },
            tileSize:16
        };

        const colorTable = {
            0:"#ffffff",
            1:"#000000"
        };

        // 1行=16文字の文字列で持つ(配布時の軽量化のため)
        const tileData = {
            0:[//floor
                "1000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000"
            ],
            1:[//wall
                "1111111111111111",
                "1000000000000001",
                "1011111111111101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1011111111111101",
                "1000000000000001",
                "1111111111111111"
            ],
            2:[//void
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111"
            ],
            3:[//desk
                "0000000000000000",
                "0000000000000000",
                "0111111111111110",
                "0100000000000010",
                "0100000000000010",
                "0100000000000010",
                "0100000000000010",
                "0111111111111110",
                "0001000000001000",
                "0001000000001000",
                "0001000000001000",
                "0001000000001000",
                "0001000000001000",
                "0001000000001000",
                "0000000000000000",
                "0000000000000000"
            ],
            4:[//blackboard
                "0000000000000000",
                "1111111111111111",
                "0000000000000000",
                "1111111111111111",
                "1111111111111111",
                "1111110011111111",
                "1111111111100111",
                "1111111111111111",
                "1110011111111111",
                "1111111111111111",
                "1111111111111111",
                "0000000000000000",
                "1111111111111111",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000"
            ],
            5:[//door
                "1111111111111111",
                "1000000000000001",
                "1011111111111101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000110101",
                "1010000000110101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1010000000000101",
                "1011111111111101",
                "1000000000000001"
            ],
            6:[//window
                "1111111111111111",
                "1000000000000001",
                "1011111111111101",
                "1010000110000101",
                "1010000110000101",
                "1010000110000101",
                "1010000110000101",
                "1011111111111101",
                "1010000110000101",
                "1010000110000101",
                "1010000110000101",
                "1010000110000101",
                "1011111111111101",
                "1000000000000001",
                "1111111111111111",
                "1111111111111111"
            ]
        };

        // 通れないタイル(floor以外)
        const solidTiles = new Set([1,2,3,4,5,6]);

        // 1行=1文字1タイルの文字列。縦横のサイズはマップごとに自由
        const mapData = {
            1:[//classroom
                "11111111111111",
                "10044444444001",
                "10000333300001",
                "10000000000005",
                "60000000000001",
                "10300300300301",
                "10000000000001",
                "60000000000001",
                "10300300300301",
                "10000000000001",
                "60000000000001",
                "10300300300301",
                "10000000000001",
                "60000000000001",
                "10300300300301",
                "10000000000001",
                "10000000000005",
                "10000444400001",
                "11111111111111"
            ]
        };

        const player = {
            x:192,
            y:256,
            w:16,
            h:16,
            speed:180,//1秒あたりのピクセル数(11.25タイル/秒)
            tex:[
                "0000000000000000",
                "0000011111100000",
                "0000111111110000",
                "0000111111110000",
                "0000110000110000",
                "0000101001010000",
                "0000100000010000",
                "0000100110010000",
                "0000011111100000",
                "0000111111110000",
                "0001101111011000",
                "0001101111011000",
                "0001100110011000",
                "0000011001100000",
                "0000011001100000",
                "0000111001110000"
            ]
        };

        const gameData = {
            mapId:1
        };

        const camera = {
            x:0,
            y:0
        };

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = config.canvas.width;
        canvas.height = config.canvas.height;

        // 文字列のドット絵を一度だけ描いておき、毎フレームはそれをコピーする
        const makeTexture = (rows) => {
            const tex = document.createElement("canvas");
            tex.width = config.tileSize;
            tex.height = config.tileSize;
            const texCtx = tex.getContext("2d");

            for (let py = 0; py < rows.length; py++) {
                for (let px = 0; px < rows[py].length; px++) {
                    texCtx.fillStyle = colorTable[rows[py][px]];
                    texCtx.fillRect(px,py,1,1);
                };
            };
            return tex;
        };

        const tileTextures = {};
        for (const id in tileData) {
            tileTextures[id] = makeTexture(tileData[id]);
        };
        player.texture = makeTexture(player.tex);

        // マップ外は壁として扱う
        const getTile = (tx,ty) => {
            const row = mapData[gameData.mapId][ty];
            if (row === undefined || tx < 0 || tx >= row.length) {
                return 1;
            };
            return Number(row[tx]);
        };

        const updateCamera = () => {
            const map = mapData[gameData.mapId];
            const maxX = map[0].length*config.tileSize - config.canvas.width;
            const maxY = map.length*config.tileSize - config.canvas.height;

            // マップが画面より小さい場合は中央に置く
            camera.x = maxX <= 0 ? Math.floor(maxX/2) : Math.max(0,Math.min(maxX,player.x + player.w/2 - config.canvas.width/2));
            camera.y = maxY <= 0 ? Math.floor(maxY/2) : Math.max(0,Math.min(maxY,player.y + player.h/2 - config.canvas.height/2));
        };

        const drawMap = (mapId) => {

            const map = mapData[mapId];
            const size = config.tileSize;

            ctx.fillStyle = colorTable[1];
            ctx.fillRect(0,0,config.canvas.width,config.canvas.height);

            // 画面に映る範囲のタイルだけ描く
            const startX = Math.max(0,Math.floor(camera.x/size));
            const startY = Math.max(0,Math.floor(camera.y/size));
            const endX = Math.ceil((camera.x + config.canvas.width)/size);
            const endY = Math.ceil((camera.y + config.canvas.height)/size);

            for (let ty = startY; ty < endY && ty < map.length; ty++) {
                for (let tx = startX; tx < endX && tx < map[ty].length; tx++) {
                    ctx.drawImage(
                        tileTextures[map[ty][tx]],
                        tx*size - camera.x,
                        ty*size - camera.y
                    );
                };
            };

        };

        const drawEntity = (entity) => {
            ctx.drawImage(
                entity.texture,
                entity.x - camera.x,
                entity.y - camera.y
            );
        };

        const isColliding = (entity) => {
            const size = config.tileSize;
            const left = Math.floor(entity.x/size);
            const right = Math.floor((entity.x+entity.w-1)/size);
            const top = Math.floor(entity.y/size);
            const bottom = Math.floor((entity.y+entity.h-1)/size);

            return solidTiles.has(getTile(left,top))
                || solidTiles.has(getTile(right,top))
                || solidTiles.has(getTile(left,bottom))
                || solidTiles.has(getTile(right,bottom));
        };

        const key = {
            up:false,
            down:false,
            right:false,
            left:false
        };

        document.addEventListener("keydown",(event) => {
            switch (event.key) {
                case "ArrowUp":
                    key.up = true
                    break;
                case "ArrowDown":
                    key.down = true
                    break;
                case "ArrowRight":
                    key.right = true
                    break;
                case "ArrowLeft":
                    key.left = true
                    break;
            };
        });

        document.addEventListener("keyup",(event) => {
            switch (event.key) {
                case "ArrowUp":
                    key.up = false;
                    break;
                case "ArrowDown":
                    key.down = false;
                    break;
                case "ArrowRight":
                    key.right = false;
                    break;
                case "ArrowLeft":
                    key.left = false;
                    break;
            };
        });

        // 最初に触れた位置を基準に、一番近い上下左右へ動かす(下半分で操作、離すとリセット)
        const stick = {
            id:null,
            originX:0,
            originY:0,
            radius:60,
            deadZone:12,
            base:document.getElementById("stickBase"),
            knob:document.getElementById("stickKnob")
        };

        const setStick = (x,y,visible) => {
            stick.base.hidden = !visible;
            stick.knob.hidden = !visible;
            stick.base.style.left = stick.originX + "px";
            stick.base.style.top = stick.originY + "px";
            stick.knob.style.left = x + "px";
            stick.knob.style.top = y + "px";
        };

        const updateStick = (x,y) => {
            const dx = x - stick.originX;
            const dy = y - stick.originY;
            const dist = Math.hypot(dx,dy);

            key.up = key.down = key.left = key.right = false;
            if (dist >= stick.deadZone) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    key.right = dx > 0;
                    key.left = dx < 0;
                } else {
                    key.down = dy > 0;
                    key.up = dy < 0;
                };
            };

            // つまみは円の外に出ないようにする
            const rate = dist > stick.radius ? stick.radius/dist : 1;
            setStick(stick.originX + dx*rate,stick.originY + dy*rate,true);
        };

        const releaseStick = () => {
            stick.id = null;
            key.up = key.down = key.left = key.right = false;
            setStick(0,0,false);
        };

        document.addEventListener("pointerdown",(event) => {
            if (stick.id !== null || event.clientY < window.innerHeight/2) {
                return;
            };
            stick.id = event.pointerId;
            stick.originX = event.clientX;
            stick.originY = event.clientY;
            updateStick(event.clientX,event.clientY);
        });

        document.addEventListener("pointermove",(event) => {
            if (event.pointerId === stick.id) {
                updateStick(event.clientX,event.clientY);
            };
        });

        document.addEventListener("pointerup",(event) => {
            if (event.pointerId === stick.id) {
                releaseStick();
            };
        });

        document.addEventListener("pointercancel",(event) => {
            if (event.pointerId === stick.id) {
                releaseStick();
            };
        });

        // 1ピクセルずつ進めて壁に当たったら止める(フレームが飛んでも壁を抜けない)
        const movePlayer = (dx,dy,steps) => {
            for (let i = 0; i < steps; i++) {
                player.x += dx;
                player.y += dy;
                if (isColliding(player)) {
                    player.x -= dx;
                    player.y -= dy;
                    break;
                };
            };
        };

        let lastTime = null;
        let moveRemain = 0;

        const gameLoop = (time) => {

            // タブ切り替え後などで一気に進まないよう、経過時間に上限を付ける
            const delta = lastTime === null ? 0 : Math.min((time - lastTime)/1000,0.05);
            lastTime = time;

            moveRemain += player.speed*delta;
            const steps = Math.floor(moveRemain);
            moveRemain -= steps;

            if (key.up) {
                movePlayer(0,-1,steps);
            } else if (key.down) {
                movePlayer(0,1,steps);
            } else if (key.right) {
                movePlayer(1,0,steps);
            } else if (key.left) {
                movePlayer(-1,0,steps);
            };

            updateCamera();
            drawMap(gameData.mapId);
            drawEntity(player);

            requestAnimationFrame(gameLoop);
        };

        requestAnimationFrame(gameLoop);

    </script>

</body>

</html>
